name: Deploy to Rumahweb

on:
  push:
    branches: [main]
  # Jalankan manual dari tab Actions. Default dry-run: hanya menampilkan file yang akan diunggah.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Uji coba tanpa mengunggah (hanya daftar file)"
        type: boolean
        default: true

# Satu deploy pada satu waktu supaya dua push berdekatan tidak saling menimpa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hosting mengirim Cache-Control 7 hari untuk CSS. Ganti penanda versi di index.html
      # dengan SHA commit supaya setiap deploy memaksa browser mengambil CSS/JS terbaru.
      - name: Cache-bust asset URLs
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" index.html

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS: login dan file dienkripsi. Jika gagal konek/TLS, ganti ke "ftp" lalu hubungi Rumahweb.
          protocol: ftps
          # loose: tetap terenkripsi, tapi tidak menolak sertifikat hosting bersama yang namanya berbeda dari domain.
          security: loose
          local-dir: ./
          # Akun FTP ini sudah berakar di web root domain utama (terbukti: file di "/" tampil di domain).
          # Jangan pakai /public_html/ di sini: itu membuat folder bersarang yang tidak ditayangkan di akar situs.
          server-dir: /
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/docs/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            **/*.log
            **/README.md
